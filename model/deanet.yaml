
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024, 6]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, CBA, [64, 3, 2]] # 0-P1/2
  - [-1, 1, CBA, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, DownLTSPD, [256]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, DownLT, [512]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, DownLT, [1024]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# deanet head
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, FAM, [256,False]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, FAM, [256,False]]  # 16 (P3/8-small)

  - [-1, 1, AConv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]  # cat head P4
  - [-1, 3, FAM, [512,False]]  # 19(P4/16-medium)

  - [-1, 1, AConv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]  # cat head P5
  - [-1, 3, FAM, [512,False]]  # 22 (P5/32-large)

  - [[13, 16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)
